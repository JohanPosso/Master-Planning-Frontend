<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:224px;height:100%;flex:none;background:var(--sunken);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:2px;font-family:Geist,system-ui,sans-serif;color:var(--text)">
  <div style="display:flex;align-items:center;gap:10px;padding:4px 8px 18px">
    <span style="width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--primaryFg);display:grid;place-items:center;font-weight:700;font-size:14px">J</span>
    <div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:14px;font-weight:600">Jornada</span><span style="font-size:12px;color:var(--muted)">Cafetería</span></div>
  </div>
  <sc-for list="{{ items }}" as="n" hint-placeholder-count="6">
    <div style="{{ n.st }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg><span>{{ n.t }}</span></div>
  </sc-for>
  <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--border)">
    <span style="width:28px;height:28px;border-radius:50%;background:var(--primary-tint);color:var(--text);display:grid;place-items:center;font-size:11px;font-weight:600">EN</span>
    <div style="display:flex;flex-direction:column;flex:1;min-width:0"><span style="font-size:13px;font-weight:600">Encargado</span><span style="font-size:11px;color:var(--muted)">Administrador</span></div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:224,&quot;height&quot;:800},&quot;activo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Inicio&quot;,&quot;Horario&quot;,&quot;Registro de horas&quot;,&quot;Nómina&quot;,&quot;Equipo&quot;,&quot;Ajustes&quot;],&quot;default&quot;:&quot;Horario&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { m: null };
  componentDidMount() { import('./datos.js').then(m => this.setState({ m })); }
  renderVals() {
    const m = this.state.m;
    return { items: m ? m.nav(this.props.activo ?? 'Horario') : undefined };
  }
}
</script>
</body>
</html>
